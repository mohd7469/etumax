
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Not Found | Store</title>
    <meta name="description" content="The product or page you are looking for does not exist.">
    <meta name="robots" content="noindex, follow">
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 2rem; background: #fff; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: #71717a; margin-bottom: 1.5rem; }
        a { display: inline-block; background: #3b82f6; color: #fff; padding: 0.5rem 1rem; text-decoration: none; border-radius: 0.25rem; }
        a:hover { background: #2563eb; }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "404 Not Found",
      "description": "The requested resource could not be found."
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Product Not Found</h1>
        <p>Sorry, the page or product you're looking for doesn't exist or has been removed.</p>
        <a href="/">Return to Homepage</a>
    </div>
</body>
</html>
